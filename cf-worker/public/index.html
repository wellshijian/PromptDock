<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PromptDock - 我的提示词卡片资源</title>
  <script>
    // 立即检查认证状态，未登录即跳转到登录页
    if (!localStorage.getItem('promptdock_token')) {
      window.location.replace('/login.html');
    }
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #818cf8;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 14px -2px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; }

    /* 顶部导航栏 */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .brand-wrap { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 18px; font-weight: 800; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }
    .brand-text h1 { font-size: 17px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
    .brand-text p { font-size: 12px; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

    .user-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 20px; font-size: 13px; color: var(--text-main);
    }
    .user-pill b { color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; border: none; outline: none;
    }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 6px rgba(79,70,229,0.25); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { background: #f1f5f9; color: var(--text-main); }
    .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fecaca; }

    /* 主容器 */
    .main-wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px; }

    /* 搜索 & 筛选控制台 */
    .filter-section {
      background: var(--surface); border-radius: var(--radius-md);
      border: 1px solid var(--border); padding: 18px 20px;
      box-shadow: var(--shadow-sm); margin-bottom: 24px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .search-row { display: flex; gap: 12px; align-items: center; }
    .search-container { position: relative; flex: 1; }
    .search-input {
      width: 100%; border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 16px 11px 40px; font-size: 14px; background: #f8fafc;
      transition: all 0.2s; outline: none;
    }
    .search-input:focus { border-color: var(--border-focus); background: white; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-muted); }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: #cbd5e1; color: white; border-radius: 50%; width: 18px; height: 18px;
      display: none; align-items: center; justify-content: center; font-size: 11px; cursor: pointer;
    }

    .folders-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .folders-bar::-webkit-scrollbar { display: none; }
    .folder-pill {
      white-space: nowrap; font-size: 13px; font-weight: 500;
      padding: 6px 14px; border-radius: 20px;
      background: #f1f5f9; border: 1px solid transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .folder-pill:hover { background: #e2e8f0; color: var(--text-main); }
    .folder-pill.active { background: var(--primary); color: white; font-weight: 600; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25); }

    .summary-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-muted); padding: 0 4px;
    }

    /* 卡片网格 */
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    /* 卡片样式 */
    .prompt-card {
      background: var(--surface); border-radius: var(--radius-md);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }
    .prompt-card:hover {
      transform: translateY(-2px); box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .card-accent-bar { height: 4px; width: 100%; background: var(--primary); }
    .card-body { padding: 18px 20px; display: flex; flex-direction: column; flex: 1; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .card-title-wrap { flex: 1; }
    .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1.4; word-break: break-word; }
    .card-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .badge-pin { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-folder { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    /* 段落列表 */
    .segments-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; flex: 1; }
    .segment-box {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; position: relative; transition: all 0.15s;
    }
    .segment-box:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .segment-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .segment-tag {
      font-size: 11px; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px;
      background: white; border: 1px solid var(--border); color: var(--primary);
      cursor: pointer; transition: all 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .copy-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .copy-btn.copied { background: #10b981 !important; color: white !important; border-color: #10b981 !important; }

    .segment-content {
      font-size: 13.5px; line-height: 1.6; color: #334155;
      word-break: break-word; white-space: pre-wrap; font-family: inherit;
    }

    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border);
      font-size: 12px; color: var(--text-muted);
    }
    .copy-all-btn {
      background: none; border: none; color: var(--primary); font-size: 12px;
      font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    }
    .copy-all-btn:hover { background: var(--primary-light); }

    /* 空状态提示 */
    .empty-state {
      grid-column: 1 / -1; background: var(--surface); border: 2px dashed var(--border);
      border-radius: var(--radius-md); padding: 60px 20px; text-align: center;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .empty-desc { font-size: 14px; color: var(--text-muted); max-width: 480px; margin: 0 auto 20px; line-height: 1.6; }

    /* 全局轻提示 Toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a; color: white; padding: 10px 22px; border-radius: 30px;
      font-size: 13px; font-weight: 600; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; align-items: center; gap: 8px;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    /* 响应式调整 */
    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      .brand-text p { display: none; }
      .status-badge { display: none; }
      .main-wrap { padding: 16px 12px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <a href="/" class="brand-wrap">
      <div class="brand-logo">P</div>
      <div class="brand-text">
        <h1>PromptDock 随身卡片库</h1>
        <p>云端同步资源工作台</p>
      </div>
    </a>

    <div class="header-actions">
      <div class="status-badge" id="syncStatusBadge">
        <span class="status-dot"></span>
        <span id="syncStatusText">云端已连接</span>
      </div>

      <div class="user-pill">
        <span>👤</span>
        <span id="userAccountName">加载中...</span>
      </div>

      <button class="btn btn-ghost" onclick="loadPrompts(true)" title="立即刷新数据">
        🔄 刷新
      </button>

      <button class="btn btn-danger" onclick="logout()" title="安全退出">
        退出
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-wrap">
    <!-- 筛选与搜索工具条 -->
    <div class="filter-section">
      <div class="search-row">
        <div class="search-container">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="快速搜索提示词标题、分类、段落正文..." oninput="onSearchInput()">
          <span class="search-clear" id="searchClear" onclick="clearSearch()">×</span>
        </div>
      </div>

      <!-- 分类标签栏 -->
      <div class="folders-bar" id="foldersBar">
        <button class="folder-pill active" onclick="selectFolder('')">全部</button>
      </div>

      <!-- 概览状态栏 -->
      <div class="summary-bar">
        <span id="cardCountSummary">正在拉取您的提示词卡片资源...</span>
        <span>💡 点击段落右上角【复制】即可快速粘入 AI 工具</span>
      </div>
    </div>

    <!-- 卡片网格展示容器 -->
    <div class="cards-grid" id="cardsContainer">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">正在连接云端资源库...</div>
        <div class="empty-desc">正在拉取您的提示词数据，请稍候</div>
      </div>
    </div>
  </main>

  <!-- 浮动提示组件 -->
  <div id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastText">已成功复制到剪贴板</span>
  </div>

  <script>
    let token = localStorage.getItem("promptdock_token");
    let currentEmail = localStorage.getItem("promptdock_email") || "已登录用户";
    let currentNick = localStorage.getItem("promptdock_nickname") || "";
    let allPrompts = [];
    let activeFolder = "";

    // 页面初始化
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("userAccountName").textContent = currentNick || currentEmail;
      loadPrompts();
    });

    // 复制功能
    function copyText(text, btnElement) {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          triggerCopyFeedback(btnElement);
        }).catch(() => {
          fallbackCopy(text, btnElement);
        });
      } else {
        fallbackCopy(text, btnElement);
      }
    }

    function fallbackCopy(text, btnElement) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        triggerCopyFeedback(btnElement);
      } catch (err) {
        showToast("❌ 复制失败，请手动选择复制", "error");
      }
      document.body.removeChild(ta);
    }

    function triggerCopyFeedback(btnElement) {
      showToast("已成功复制到剪贴板！", "success");
      if (btnElement) {
        const originalText = btnElement.innerHTML;
        btnElement.classList.add("copied");
        btnElement.innerHTML = "✔ 已复制";
        setTimeout(() => {
          btnElement.classList.remove("copied");
          btnElement.innerHTML = originalText;
        }, 1200);
      }
    }

    function copyAllSegments(promptId) {
      const p = allPrompts.find(item => item.id === promptId);
      if (!p || !p.segments || p.segments.length === 0) return;
      const combined = p.segments.map(s => s.content).filter(Boolean).join("\n\n");
      copyText(combined);
    }

    // 轻提示
    let toastTimer = null;
    function showToast(msg, type = "success") {
      const toast = document.getElementById("toast");
      const icon = document.getElementById("toastIcon");
      const text = document.getElementById("toastText");
      icon.textContent = type === "success" ? "✅" : "⚠️";
      text.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }

    // 数据拉取
    async function loadPrompts(manual = false) {
      const container = document.getElementById("cardsContainer");
      if (manual) {
        document.getElementById("syncStatusText").textContent = "正在同步...";
      }

      try {
        const res = await fetch("/api/sync/pull?since=0", {
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          }
        });

        if (res.status === 401) {
          localStorage.removeItem("promptdock_token");
          window.location.replace("/login.html");
          return;
        }

        const data = await res.json();
        allPrompts = (data.prompts || []).filter(p => !p.is_deleted);
        
        document.getElementById("syncStatusText").textContent = "云端已连接 · " + allPrompts.length + " 个资源";
        renderFolders();
        filterPrompts();

        if (manual) {
          showToast("已拉取最新提示词卡片数据 (" + allPrompts.length + " 条)");
        }
      } catch (err) {
        document.getElementById("syncStatusText").textContent = "同步失败";
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">拉取云端数据失败</div>
            <div class="empty-desc">${escapeHtml(err.message)}</div>
            <button class="btn btn-primary" onclick="loadPrompts(true)">重试拉取</button>
          </div>
        `;
      }
    }

    // 渲染分类
    function renderFolders() {
      const folders = new Set();
      allPrompts.forEach(p => {
        const f = (p.folder || "").trim();
        if (f) folders.add(f);
      });

      const bar = document.getElementById("foldersBar");
      let html = `<button class="folder-pill ${activeFolder === "" ? "active" : ""}" onclick="selectFolder('')">全部 (${allPrompts.length})</button>`;
      
      folders.forEach(f => {
        const count = allPrompts.filter(p => (p.folder || "").trim() === f).length;
        html += `<button class="folder-pill ${activeFolder === f ? "active" : ""}" onclick="selectFolder('${escapeAttr(f)}')">${escapeHtml(f)} (${count})</button>`;
      });

      bar.innerHTML = html;
    }

    function selectFolder(f) {
      activeFolder = f;
      renderFolders();
      filterPrompts();
    }

    // 搜索输入
    function onSearchInput() {
      const val = document.getElementById("searchInput").value;
      document.getElementById("searchClear").style.display = val ? "inline-flex" : "none";
      filterPrompts();
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("searchClear").style.display = "none";
      filterPrompts();
    }

    // 筛选与卡片渲染
    function filterPrompts() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      let list = allPrompts;

      if (activeFolder) {
        list = list.filter(p => (p.folder || "").trim() === activeFolder);
      }

      if (q) {
        list = list.filter(p => {
          if ((p.title || "").toLowerCase().includes(q)) return true;
          if ((p.folder || "").toLowerCase().includes(q)) return true;
          return (p.segments || []).some(s => (s.content || "").toLowerCase().includes(q) || (s.tag || "").toLowerCase().includes(q));
        });
      }

      // 置顶优先，最新修改优先
      list.sort((a, b) => {
        if (b.pinned !== a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
        return (b.updated_at || 0) - (a.updated_at || 0);
      });

      document.getElementById("cardCountSummary").textContent = `显示 ${list.length} 张卡片 (总共 ${allPrompts.length} 张)`;

      const container = document.getElementById("cardsContainer");
      if (list.length === 0) {
        if (allPrompts.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🗂️</div>
              <div class="empty-title">云端暂无提示词卡片</div>
              <div class="empty-desc">
                您当前登录的账号为 <b>${escapeHtml(currentEmail)}</b>。<br>
                打开电脑端 PromptDock 客户端登录此账号后，您的本地提示词将秒级自动同步到此处；您可在任意手机或浏览器即点即用！
              </div>
              <button class="btn btn-primary" onclick="loadPrompts(true)">刷新同步</button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🔍</div>
              <div class="empty-title">未找到匹配的提示词</div>
              <div class="empty-desc">没有找到符合关键词 "${escapeHtml(q)}" 的提示词卡片</div>
              <button class="btn btn-ghost" onclick="clearSearch()">清除搜索条件</button>
            </div>
          `;
        }
        return;
      }

      let html = "";
      list.forEach(p => {
        const cardColor = p.color || "#4f46e5";
        const segments = Array.isArray(p.segments) ? p.segments : [];

        html += `
          <div class="prompt-card">
            <div class="card-accent-bar" style="background: ${escapeAttr(cardColor)};"></div>
            <div class="card-body">
              <div class="card-header">
                <div class="card-title-wrap">
                  <div class="card-title">${escapeHtml(p.title || "未命名卡片")}</div>
                  <div class="card-meta">
                    ${p.pinned ? '<span class="badge badge-pin">📌 置顶</span>' : ''}
                    ${p.folder ? `<span class="badge badge-folder">📁 ${escapeHtml(p.folder)}</span>` : ''}
                  </div>
                </div>
              </div>

              <div class="segments-list">
                ${segments.map((seg, idx) => `
                  <div class="segment-box">
                    <div class="segment-head">
                      <span class="segment-tag">${escapeHtml(seg.tag || ('段落 ' + (idx + 1)))}</span>
                      <button class="copy-btn" onclick="copyText(this.closest('.segment-box').querySelector('.segment-content').textContent, this)">
                        📋 复制
                      </button>
                    </div>
                    <div class="segment-content">${escapeHtml(seg.content || "")}</div>
                  </div>
                `).join("")}
              </div>

              <div class="card-footer">
                <span>共 ${segments.length} 个提示词段落</span>
                ${segments.length > 1 ? `<button class="copy-all-btn" onclick="copyAllSegments('${escapeAttr(p.id)}')">📑 复制全部段落</button>` : ''}
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // 退出登录
    function logout() {
      if (confirm("确定要退出登录吗？")) {
        localStorage.removeItem("promptdock_token");
        localStorage.removeItem("promptdock_email");
        localStorage.removeItem("promptdock_nickname");
        window.location.replace("/login.html");
      }
    }

    // 安全转义函数
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      if (!str) return "";
      return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
